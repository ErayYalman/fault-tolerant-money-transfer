spring:
  config:
    import: optional:file:../../.env[.properties]

  application:
    name: reconciliation-service

  http:
    client:
      connect-timeout: 2s
      read-timeout: 5s

  datasource:
    url: jdbc:postgresql://${POSTGRES_RECONCILIATION_HOST:localhost}:${POSTGRES_RECONCILIATION_PORT:5435}/${POSTGRES_RECONCILIATION_DB}
    username: ${POSTGRES_RECONCILIATION_USER}
    password: ${POSTGRES_RECONCILIATION_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

server:
  port: ${RECONCILIATION_SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - circuitbreakers

  endpoint:
    health:
      probes:
        enabled: true

resilience4j:
  circuitbreaker:
    configs:
      externalService:
        registerHealthIndicator: false
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 4
        minimumNumberOfCalls: 4
        failureRateThreshold: 50
        waitDurationInOpenState: 20s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: false
        recordExceptions:
          - org.springframework.web.client.RestClientException
          - java.lang.IllegalStateException
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException
        eventConsumerBufferSize: 20

    instances:
      transferService:
        baseConfig: externalService

      paymentAService:
        baseConfig: externalService

      paymentBService:
        baseConfig: externalService

      mlService:
        baseConfig: externalService

reconciliation:
  ml:
    base-url: ${ML_SERVICE_BASE_URL:http://localhost:8090}
  schedule:
    enabled: ${RECONCILIATION_SCHEDULE_ENABLED:true}
    cron: ${RECONCILIATION_SCHEDULE_CRON:0 0 3 * * *}
  time-zone: ${RECONCILIATION_TIME_ZONE:Europe/Istanbul}
  clients:
    transfer-base-url: ${TRANSFER_SERVICE_BASE_URL:http://localhost:8080}
    payment-a-base-url: ${PAYMENT_A_SERVICE_BASE_URL:http://localhost:8081}
    payment-b-base-url: ${PAYMENT_B_SERVICE_BASE_URL:http://localhost:8082}
    page-size: ${RECONCILIATION_CLIENT_PAGE_SIZE:500}