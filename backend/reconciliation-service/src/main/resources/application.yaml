spring:
  config:
    import: optional:file:../../.env[.properties]

  application:
    name: reconciliation-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_RECONCILIATION_HOST:localhost}:${POSTGRES_RECONCILIATION_PORT:5435}/${POSTGRES_RECONCILIATION_DB}
    username: ${POSTGRES_RECONCILIATION_USER}
    password: ${POSTGRES_RECONCILIATION_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

server:
  port: ${RECONCILIATION_SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      probes:
        enabled: true

reconciliation:
  clients:
    transfer-base-url: ${TRANSFER_SERVICE_BASE_URL:http://localhost:8080}
    payment-a-base-url: ${PAYMENT_A_SERVICE_BASE_URL:http://localhost:8081}
    payment-b-base-url: ${PAYMENT_B_SERVICE_BASE_URL:http://localhost:8082}
    page-size: ${RECONCILIATION_CLIENT_PAGE_SIZE:500}