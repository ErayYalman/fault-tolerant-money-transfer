spring:
  config:
    import: optional:file:../../.env[.properties]

  application:
    name: payment-service-a

  datasource:
    url: jdbc:postgresql://${POSTGRES_PAYMENT_A_HOST:localhost}:${POSTGRES_PAYMENT_A_PORT:5433}/${POSTGRES_PAYMENT_A_DB}
    username: ${POSTGRES_PAYMENT_A_USER}
    password: ${POSTGRES_PAYMENT_A_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      group-id: ${KAFKA_PAYMENT_A_CONSUMER_GROUP_ID:payment-service-a}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    listener:
      ack-mode: record

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        "[enable.idempotence]": "true"
        "[request.timeout.ms]": "5000"
        "[delivery.timeout.ms]": "10000"
        "[max.block.ms]": "10000"

server:
  port: ${PAYMENT_A_SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      probes:
        enabled: true

app:
  kafka:
    enabled: true
    consumer:
      retry-interval-ms: ${KAFKA_CONSUMER_RETRY_INTERVAL_MS:1000}

  outbox:
    relay:
      enabled: true
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    send-timeout-ms: ${OUTBOX_SEND_TIMEOUT_MS:10000}