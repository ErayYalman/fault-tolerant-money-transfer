spring:
  config:
    import: optional:file:../../.env[.properties]

  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: transfer-service
              uri: ${GATEWAY_TRANSFER_SERVICE_URL:http://localhost:8080}
              predicates:
                - Path=/api/v1/transfers,/api/v1/transfers/**

server:
  port: ${API_GATEWAY_SERVER_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      probes:
        enabled: true