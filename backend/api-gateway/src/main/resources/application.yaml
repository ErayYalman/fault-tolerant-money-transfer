spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${GATEWAY_KEYCLOAK_ISSUER:http://localhost:8180/realms/money-transfer}
          jwk-set-uri: ${GATEWAY_KEYCLOAK_JWKS_URL:http://localhost:8180/realms/money-transfer/protocol/openid-connect/certs}
          audiences:
            - ${GATEWAY_SERVICE_OIDC_AUDIENCE:api-gateway}
          jws-algorithms:
            - RS256
  config:
    import: optional:file:../../.env[.properties]

  application:
    name: api-gateway

  webflux:
    problemdetails:
      enabled: true

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:5s}

          routes:
            - id: transfer-service
              uri: ${GATEWAY_TRANSFER_SERVICE_BASE_URL:http://localhost:8080}
              predicates:
                - Path=/api/v1/transfers,/api/v1/transfers/**
                
            - id: reconciliation-service
              uri: ${GATEWAY_RECONCILIATION_SERVICE_BASE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/reconciliation,/api/v1/reconciliation/**

            - id: payment-service-a
              uri: ${GATEWAY_PAYMENT_A_SERVICE_BASE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/accounts,/api/v1/accounts/**

server:
  port: ${API_GATEWAY_SERVER_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include:
          - health

  endpoint:
    health:
      probes:
        enabled: true