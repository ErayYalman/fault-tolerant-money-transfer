spring:
  config:
    import: optional:file:../../.env[.properties]

  application:
    name: api-gateway

  webflux:
    problemdetails:
      enabled: true

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:5s}

          routes:
            - id: transfer-service
              uri: ${GATEWAY_TRANSFER_SERVICE_BASE_URL:http://localhost:8080}
              predicates:
                - Path=/api/v1/transfers,/api/v1/transfers/**

server:
  port: ${API_GATEWAY_SERVER_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include:
          - health

  endpoint:
    health:
      probes:
        enabled: true