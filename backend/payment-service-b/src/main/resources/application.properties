quarkus.application.name=payment-service-b
quarkus.http.port=${PAYMENT_B_SERVER_PORT:8082}


# PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_PAYMENT_B_USER:payment_b_user}
quarkus.datasource.password=${POSTGRES_PAYMENT_B_PASSWORD:change_me}
quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_PAYMENT_B_HOST:localhost}:${POSTGRES_PAYMENT_B_PORT:5434}/${POSTGRES_PAYMENT_B_DB:payment_b_db}
quarkus.datasource.jdbc.max-size=16

# Flyway is the schema owner; Hibernate must not generate schema changes.
quarkus.flyway.locations=db/migration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-at-start=true
quarkus.flyway.clean-disabled=true
quarkus.hibernate-orm.mapping.format.global=ignore

%test.quarkus.flyway.validate-at-start=false

# API documentation and health
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=false
quarkus.smallrye-health.root-path=/q/health

quarkus.log.level=INFO

quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.log.sql=false

# Kafka: incoming credit command
mp.messaging.incoming.credit-requested.connector=smallrye-kafka
mp.messaging.incoming.credit-requested.topic=transfer.commands.credit-requested
mp.messaging.incoming.credit-requested.group.id=${KAFKA_PAYMENT_B_CONSUMER_GROUP_ID:payment-service-b}
mp.messaging.incoming.credit-requested.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.credit-requested.auto.offset.reset=earliest
mp.messaging.incoming.credit-requested.enable.auto.commit=false
mp.messaging.incoming.credit-requested.commit-strategy=throttled

# Kafka: outgoing events, with topic selected by message metadata
mp.messaging.outgoing.payment-events.connector=smallrye-kafka
mp.messaging.outgoing.payment-events.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.payment-events.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.payment-events.acks=all
mp.messaging.outgoing.payment-events.enable.idempotence=true

# Runtime broker address. Under Docker Compose, use kafka:19092
# if the application itself runs inside the Compose network.
%dev.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Outbox polling
app.outbox.poll-interval=1s
app.outbox.batch-size=100
app.outbox.send-timeout-ms=10000

# Keep Kafka and scheduler off in ordinary tests.
# The dedicated E2E test resource will explicitly enable Kafka.
%test.quarkus.kafka.devservices.enabled=false
%test.quarkus.scheduler.enabled=false
%test.mp.messaging.incoming.credit-requested.enabled=false
%test.mp.messaging.outgoing.payment-events.enabled=false