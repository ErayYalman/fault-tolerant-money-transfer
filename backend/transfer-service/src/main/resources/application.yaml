spring:
  config:
    import: optional:file:.env[.properties]
    
  application:
    name: transfer-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_TRANSFER_DB}
    username: ${POSTGRES_TRANSFER_USER}
    password: ${POSTGRES_TRANSFER_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:transfer-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    listener:
      ack-mode: record

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        "[enable.idempotence]": "true"
        "[request.timeout.ms]": "5000"
        "[delivery.timeout.ms]": "10000"
        "[max.block.ms]": "10000"

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      probes:
        enabled: true

app:
  kafka:
    enabled: true
    topic-partitions: ${KAFKA_TOPIC_PARTITIONS:3}

  outbox:
    relay:
      enabled: true
      poll-interval-ms: 1000
      batch-size: 100
      send-timeout-ms: 10000